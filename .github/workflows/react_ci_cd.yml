name: Enterprise React Clean Architecture CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Code Quality & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Type Checking
        run: npx tsc --noEmit

      - name: 🧪 Execute Clean Architecture Unit Tests & Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: 📊 Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 7

  build-production:
    name: Build & Compile Production Artifacts
    needs: quality-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Compile Production Bundle (Vite + Tailwind CSS)
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.devagency.ng/v1/contact' }}

      - name: 📁 Upload Build Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-production-build
          path: dist/
          retention-days: 14

  deploy:
    name: Deploy to Hosting Platform
    needs: build-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-production-build
          path: dist/

      - name: 🚀 Deployment Notice
        run: |
          echo "Production build successfully generated and verified."